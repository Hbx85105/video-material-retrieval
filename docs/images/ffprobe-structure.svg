<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img">
<title>ffprobe 输出分两块</title>
<desc>ffprobe 的输出分为 streams（画面和声音）和 format（整体信息）两块</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="190" y="30" width="300" height="58" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="340" y="52" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#2C2C2A" dominant-baseline="central">ffprobe 吐出来的一大坨</text>
<text x="340" y="73" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#5F5E5A" dominant-baseline="central">别慌，其实只看两块</text>
<path d="M300 88L185 152" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M380 88L495 152" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55" y="156" width="260" height="104" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="75" y="183" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0C447C" dominant-baseline="central">streams</text>
<text x="75" y="209" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#2C2C2A" dominant-baseline="central">画面和声音的详情</text>
<text x="75" y="233" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A" dominant-baseline="central">编码、分辨率、帧率、采样率</text>
<rect x="365" y="156" width="260" height="104" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
<text x="385" y="183" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#085041" dominant-baseline="central">format</text>
<text x="385" y="209" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#2C2C2A" dominant-baseline="central">整个文件的信息</text>
<text x="385" y="233" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A" dominant-baseline="central">时长、大小、码率、创建时间</text>
<text x="40" y="294" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">你忘的那句就是：看 streams（画面/声音）和 format（整体）。</text>
</svg>
